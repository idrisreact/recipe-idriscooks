<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Idris Cooks — Site Audit & Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #1C1A17; }
  body { font-family: 'DM Sans', sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/audit.jsx"></script>
<script type="text/babel" src="components/system.jsx"></script>
<script type="text/babel" src="components/heroes.jsx"></script>
<script type="text/babel" src="components/featured.jsx"></script>
<script type="text/babel" src="components/voice.jsx"></script>
<script type="text/babel" src="components/recipe-page.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => (
  <DesignCanvas
    title="Idris Cooks — audit & redesign"
    subtitle="A look at idriscooks.com today, what's holding it back, and a direction that leans into editorial cookbook instead of moody-restaurant tropes."
  >
    <DCSection id="audit" title="01 · What's there now">
      <DCArtboard id="current" label="idriscooks.com — annotated" width={1280} height={1700} background="#0e0e0e">
        <CurrentSiteRecreation />
      </DCArtboard>
    </DCSection>

    <DCSection id="system" title="02 · Proposed brand system">
      <DCArtboard id="brand-system" label="Type, colour, tone" width={1280} height={920} background="#F5EFE6">
        <SystemBoard />
      </DCArtboard>
    </DCSection>

    <DCSection id="heroes" title="03 · Hero — two directions">
      <DCArtboard id="hero-editorial" label="A · Editorial split" width={1280} height={820} background="#F5EFE6">
        <HeroEditorial />
      </DCArtboard>
      <DCArtboard id="hero-fullbleed" label="B · Full-bleed photo, personal" width={1280} height={820} background="#1C1A17">
        <HeroFullBleed />
      </DCArtboard>
    </DCSection>

    <DCSection id="featured" title="04 · Replace category tiles with actual recipes">
      <DCArtboard id="featured" label="This month's rotation" width={1280} height={1000} background="#F5EFE6">
        <FeaturedBoard />
      </DCArtboard>
    </DCSection>

    <DCSection id="voice" title="05 · The biggest fix is the words">
      <DCArtboard id="voice" label="Before / after copy" width={1280} height={1000} background="#E8DFD0">
        <VoiceBoard />
      </DCArtboard>
    </DCSection>

    <DCSection id="recipe" title="06 · Where it all has to land — the recipe page">
      <DCArtboard id="recipe-page" label="Individual recipe layout" width={1280} height={1480} background="#F5EFE6">
        <RecipePageBoard />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
